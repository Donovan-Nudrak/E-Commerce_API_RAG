[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    unit: unit tests with mocks
    integration: API tests with TestClient
    requires_postgres: RAG tests requiring PostgreSQL pgvector and Gemini API
addopts = -v --tb=short -m "not requires_postgres"
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20

# Prerequisites (standard suite uses PostgreSQL + pgvector, not SQLite):
#   - DB test (user test/test) with: CREATE EXTENSION IF NOT EXISTS vector;
#   - TEST_POSTGRES_PORT=5432 (CI/default); use 5433 for local docker-compose (host port)
#
# RAG suite (PostgreSQL test_rag + GEMINI_API_KEY):
#   export TEST_POSTGRES_PORT=5433   # if using docker-compose postgres on host 5433
#   export GEMINI_API_KEY=your_key
#   pytest tests/integration/test_rag_api.py -m requires_postgres -v \
#     --confcutdir=tests/integration -o addopts="-v --tb=short"
